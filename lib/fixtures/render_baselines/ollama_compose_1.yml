name: "cbox-infra-u@UID@"
services:
  ollama:
    image: "ollama/ollama:0.33.3"
    restart: "unless-stopped"
    labels:
      cbox.kind: infra
      cbox.component: ollama
      cbox.owner: cbox-infra-u@UID@
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - "OLLAMA_CONTEXT_LENGTH=65536"
      - "OLLAMA_KV_CACHE_TYPE=q8_0"
      - "OLLAMA_KEEP_ALIVE=30m"
      - "OLLAMA_FLASH_ATTENTION=1"
    healthcheck:
      test: ["CMD", "/bin/ollama", "ls"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    volumes:
      - cbox-ollama-u@UID@-store:/root/.ollama
networks:
  default:
    internal: true
    labels:
      cbox.kind: infra
      cbox.component: ollama-net
      cbox.owner: cbox-infra-u@UID@
volumes:
  cbox-ollama-u@UID@-store: {}
